name: Deploy

on:
  push:
    branches: [production]
  # Permite relanzar un despliegue sin empujar un commit vacio.
  workflow_dispatch:

concurrency:
  group: deploy-iris-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/atmosferasoltec/atm-iris-web

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SESSION_SECRET: ci-only-secret-not-used-in-production-0000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sin build-args: la web no usa ninguna NEXT_PUBLIC_*; la misma imagen
      # sirve en cualquier entorno y la configuracion llega por el .env.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /opt/iris-web
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script_stop: true
          # El login a GHCR vive en el servidor (~/.docker/config.json). Si el
          # pull da `denied`, renovarlo con `docker login ghcr.io` en el VPS.
          script: |
            set -e
            cd /opt/iris-web

            if [ ! -f .env ]; then
              echo "::error::Falta /opt/iris-web/.env en el servidor"
              exit 1
            fi

            export IMAGE_TAG
            docker compose pull
            docker compose up -d
            docker image prune -f

            for _ in $(seq 1 60); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' iris-web 2>/dev/null || echo missing)"
              if [ "$status" = "healthy" ]; then
                echo "iris-web esta healthy (${IMAGE_TAG})."
                exit 0
              fi
              sleep 2
            done

            echo "::error::iris-web no quedo healthy en 120s (estado: ${status}). Ultimos logs:"
            docker compose logs --tail 50 app
            exit 1
