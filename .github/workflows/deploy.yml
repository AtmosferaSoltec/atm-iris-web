name: Deploy

on:
  push:
    branches: [production]
  # Permite relanzar un despliegue sin empujar un commit vacio.
  workflow_dispatch:

concurrency:
  group: deploy-iris-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/atmosferasoltec/atm-iris-web

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SESSION_SECRET: ci-only-secret-not-used-in-production-0000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sin build-args: la web no usa ninguna NEXT_PUBLIC_*; la misma imagen
      # sirve en cualquier entorno y la configuracion llega por el .env.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/docker-compose.yml
          sparse-checkout-cone-mode: false

      # Una sola conexion SSH (ControlMaster) para copiar el compose y desplegar,
      # con reintentos al abrirla: si sshd o fail2ban cortan un handshake suelto
      # (`ssh: handshake failed: EOF`), el despliegue no se cae por eso.
      - name: Copy compose file and deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ControlMaster=auto -o ControlPath=~/.ssh/cm-%C -o ControlPersist=120)
          target="$SSH_USER@$SSH_HOST"

          for attempt in 1 2 3 4 5; do
            if ssh "${opts[@]}" "$target" true; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::No se pudo abrir la conexion SSH tras 5 intentos"; exit 1; fi
            echo "SSH fallo (intento $attempt); reintento en $((attempt * 10)) s"
            sleep $((attempt * 10))
          done

          scp "${opts[@]}" deploy/docker-compose.yml "$target:/opt/iris-web/docker-compose.yml"

          # El login a GHCR vive en el servidor (~/.docker/config.json). Si el
          # pull da `denied`, renovarlo con `docker login ghcr.io` en el VPS.
          ssh "${opts[@]}" "$target" "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -e
          cd /opt/iris-web

          if [ ! -f .env ]; then
            echo "::error::Falta /opt/iris-web/.env en el servidor"
            exit 1
          fi

          export IMAGE_TAG
          docker compose pull
          docker compose up -d
          docker image prune -f

          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' iris-web 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then
              echo "iris-web esta healthy (${IMAGE_TAG})."
              exit 0
            fi
            sleep 2
          done

          echo "::error::iris-web no quedo healthy en 120s (estado: ${status}). Ultimos logs:"
          docker compose logs --tail 50 app
          exit 1
          REMOTE
