name: Deploy

# Only a push to `production` reaches the server.
on:
  push:
    branches: [production]
  # Lets you rerun a deploy (or go back to an older one) without pushing a commit.
  workflow_dispatch:

concurrency:
  group: deploy-atm-iris-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/atmosferasoltec/atm-iris-web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: the web has no configuration, the same image runs anywhere.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=atm-iris-web
          cache-to: type=gha,scope=atm-iris-web,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/docker-compose.yml
          sparse-checkout-cone-mode: false

      # One SSH connection (ControlMaster) to copy the compose file and deploy, with
      # retries when opening it: if sshd or fail2ban cut a stray handshake, the
      # deploy does not fail because of it.
      - name: Copy compose file and deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ControlMaster=auto -o ControlPath=~/.ssh/cm-%C -o ControlPersist=120)
          target="$SSH_USER@$SSH_HOST"

          for attempt in 1 2 3 4 5; do
            if ssh "${opts[@]}" "$target" true; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::No se pudo abrir la conexion SSH tras 5 intentos"; exit 1; fi
            echo "SSH fallo (intento $attempt); reintento en $((attempt * 10)) s"
            sleep $((attempt * 10))
          done

          scp "${opts[@]}" deploy/docker-compose.yml "$target:/opt/iris-landing/docker-compose.yml"

          # The GHCR login lives on the server (~/.docker/config.json). If the pull
          # says `denied`, renew it with `docker login ghcr.io` on the VPS.
          ssh "${opts[@]}" "$target" "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -e
          cd /opt/iris-landing

          export IMAGE_TAG
          docker compose pull
          mkdir -p releases
          docker compose up -d --remove-orphans
          # Cleanup is optional: another project's deploy may be pruning at the same
          # time (`a prune operation is already running`), which must not fail this one.
          docker image prune -f || true
          # Drop the images of earlier deploys of this project (they are tagged, so prune keeps them).
          docker images ghcr.io/atmosferasoltec/atm-iris-web --format '{{.Repository}}:{{.Tag}}' \
            | grep -v -e ":${IMAGE_TAG}$" -e ':latest$' | xargs -r docker rmi || true

          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' iris-landing 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then
              echo "iris-landing esta healthy (${IMAGE_TAG})."
              exit 0
            fi
            sleep 2
          done

          echo "::error::iris-landing no quedo healthy en 120s (estado: ${status}). Ultimos logs:"
          docker compose logs --tail 50 app
          exit 1
          REMOTE
